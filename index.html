<!-- https://xisdagauchinha.compraqui.app/ -->

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clone Page</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header class = topbar>
            <div class = "icon-wrapper" data-tooltip = "Meu Carrinho">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </div>

            <div class = "icon-wrapper" data-tooltip = "Meus Pedidos">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </div>
        </header>

        <main class = container>

            <img class = "ImagemRepresentativa" src = xis.jpg 
                alt = "Imagem representativa de um xis tudo">

            <img class = "logo" src = logoxis.png
            alt = "Logo Xis da Gauchinha">

            <h3 class = identificacao>
                XIS DA GAUCHINHA
            </h3>

            <div class = menu>

                <div class = "menu-item">
                    <div class = "menu-info">
                        <span class = "menu-nome">Xis Power</span>
                        <span class = "menu-desc">tudo e mais um pouco</span>
                    </div>
                    <span class = "menu-preco">R$ 50,00</span>
                </div>

                <div class = "menu-item">
                    <div class = "menu-info">
                        <span class = "menu-nome">Xis Bagual</span>
                        <span class = "menu-desc">feito com costela defumada desfiada</span>
                    </div>
                    <span class = "menu-preco">R$ 40,00</span>
                </div>

                <div class = "menu-item">
                    <div class = "menu-info">
                        <span class = "menu-nome">Xis Duplo</span>
                        <span class = "menu-desc">o famoso xis salada com um bife a mais</span>
                    </div>
                    <span class = "menu-preco">R$ 32,00</span>
                </div>

                <div class = "menu-item">
                    <div class = "menu-info">
                        <span class = "menu-nome">Xis da Casa</span>
                        <span class = "menu-desc">somente para aqueles que buscam uma experiência única e sabor diferente de tudo</span>
                    </div>
                    <span class = "menu-preco">R$ 34,00</span>
                </div>

            </div>

        </main>
        
    </body>

</html>
